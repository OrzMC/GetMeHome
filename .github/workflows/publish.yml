name: Publish to Hangar
on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository_owner == 'wangzhizhou'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: jdk
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # 先构建 shadowJar（快速失败，不消耗 Hangar API 调用）
      - name: build shadowJar
        run: ./gradlew shadowJar --stacktrace

      # 版本一致性门禁：tag 必须与 plugin.yml 的 version 字段一致（上一轮发布后已自动递增同步）
      - name: verify tag matches plugin.yml version
        if: github.ref_type == 'tag'
        run: |
          PLUGIN_VERSION=$(sed -n 's/^version: *//p' src/main/resources/plugin.yml)
          echo "Pushed tag:         ${{ github.ref_name }}"
          echo "plugin.yml version: ${PLUGIN_VERSION}"
          if [ "${{ github.ref_name }}" != "${PLUGIN_VERSION}" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match version '${PLUGIN_VERSION}' in src/main/resources/plugin.yml"
            echo "::error::Expected a tag matching the current plugin.yml version, e.g. ${PLUGIN_VERSION}"
            exit 1
          fi

      - name: publish to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          # 发布到 Hangar，含重试逻辑。
          # Hangar 在 Release 通道处理较慢，可能返回 504 Gateway Timeout，
          # 但此时上传往往已成功完成，因此需要重试并处理"版本已存在"的情况。
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Hangar publish attempt ${attempt}/${max_attempts}"
            output=$(./gradlew publishPluginPublicationToHangar --stacktrace 2>&1) && {
              echo "$output"
              echo "::endgroup::"
              echo "Published to Hangar on attempt ${attempt}"
              echo "::group::Sync Hangar page"
              ./gradlew syncPluginPublicationMainResourcePagePageToHangar --stacktrace
              echo "::endgroup::"
              echo "Hangar page synced"
              exit 0
            }
            echo "$output"
            echo "::endgroup::"

            # 如果 Hangar 返回"版本已存在"，说明之前的尝试已成功上传
            if echo "$output" | grep -qi "already exists\|already created\|version.*already\|duplicate"; then
              echo "Version appears to already exist on Hangar — treating as success"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 20))
              echo "Attempt ${attempt} failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "All ${max_attempts} Hangar publish attempts failed"
          exit 1

      # 仅纯 SemVer tag 创建 GitHub Release（含 '-' 的预发布 tag 不创建）
      - name: create GitHub Release
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: build/libs/*.jar
          generate_release_notes: true

      # 发布完成后自动递增版本号并 push 回 main。
      # 用默认 GITHUB_TOKEN（main 未开分支保护，无需 BOT_PAT）。
      # 注意：GITHUB_TOKEN push 不会重新触发本 workflow（GitHub 防递归设计）。
      - name: bump version
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: |
          CURRENT=$(sed -n 's/^version: *//p' src/main/resources/plugin.yml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i 's/^version:.*/version: '"$NEW"'/' src/main/resources/plugin.yml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/plugin.yml
          git commit -m "chore: bump version to $NEW"
          git push origin HEAD:main
